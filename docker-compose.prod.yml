# Production Compose — operator contract
#
# 1. cp .env.example .env
# 2. Set JWT_SECRET_KEY and POSTGRES_PASSWORD (required; empty fails Compose)
# 3. Point your reverse proxy at 127.0.0.1:3004 (one upstream)
# 4. Use that public HTTPS origin for the command center and the daily driver
#    (/api is the command-center rewrite, not a second URL)
#
# Pin image tags to a release (e.g. v2.9.0). Bump the tags when updating — do not use latest as "stable".

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "log_checkpoints=off"]
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    # Pin to a release tag; bump when deploying a new version
    image: ghcr.io/trevordavies095/tempo/api:v2.9.0
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tempo;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}"
      MediaStorage__RootPath: "/app/media"
      # JWT Authentication - REQUIRED: set JWT_SECRET_KEY in .env (copy .env.example)
      # Generate with: openssl rand -base64 32
      JWT__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (copy .env.example)}"
      # Named logging profile: standard (default) | debug. Restart API after changing.
      Tempo__Logging__Profile: "${TEMPO_LOGGING_PROFILE:-standard}"
      # CARTO basemaps (optional; set CARTO_BASEMAPS_API_KEY in .env)
      CartoBasemaps__ApiKey: "${CARTO_BASEMAPS_API_KEY:-}"
    # Opt-in for Bruno / curl / unmigrated split proxies on the host only:
    # ports:
    #   - "127.0.0.1:5001:5001"
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    # Pin to a release tag; bump when deploying a new version
    image: ghcr.io/trevordavies095/tempo/frontend:v2.9.0
    ports:
      - "127.0.0.1:3004:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
