name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Tempo.sln

      - name: Build
        run: dotnet build Tempo.sln --no-restore

      - name: Verify OpenAPI spec is current
        run: |
          cd api
          # Swashbuckle boots the real host. Use Development (not Testing): the generic host
          # otherwise looks for StartupTesting, which this minimal-host app does not define.
          # In-memory SQLite + a throwaway JWT secret avoid Postgres and appsettings placeholder checks.
          export ASPNETCORE_ENVIRONMENT=Development
          export JWT__SecretKey='ci-openapi-generation-only-not-for-production-use-32b!'
          export ConnectionStrings__DefaultConnection='Data Source=:memory:'
          dotnet swagger tofile \
            --output /tmp/openapi-generated.json \
            bin/Debug/net9.0/Tempo.Api.dll \
            v1
          diff -u ../docs/openapi.json /tmp/openapi-generated.json

      - name: Run tests with coverage
        run: dotnet test Tempo.sln --no-build --verbosity detailed --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory:"TestResults" --settings:"api/Tempo.Api.Tests/coverlet.runsettings"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;Badges" \
            -classfilters:"-*Dynastream*" \
            -assemblyfilters:"-*Dynastream*"

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from Cobertura XML (line-rate attribute)
          COVERAGE_XML=$(find TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -z "$COVERAGE_XML" ]; then
            echo "❌ Coverage report not found"
            exit 1
          fi
          
          # Extract line-rate value (e.g., "0.85" for 85%)
          # Use set -o pipefail to ensure grep failure propagates, or check if result is empty
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_XML" | head -1)
          if [ -z "$COVERAGE" ]; then
            COVERAGE="0"
          fi
          
          # Calculate percentage (multiply by 100 and round)
          COVERAGE_PERCENT=$(awk "BEGIN {printf \"%.0f\", $COVERAGE * 100}")
          
          echo "Current coverage: ${COVERAGE_PERCENT}%"
          echo "Required coverage: 45%"
          
          if [ "$COVERAGE_PERCENT" -lt 45 ]; then
            echo "❌ Coverage ${COVERAGE_PERCENT}% is below the required 45% threshold"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE_PERCENT}% meets the required 45% threshold"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/coverage.cobertura.xml
            **/TestResults/**/coverage.cobertura.xml
            coverage-report/**
          retention-days: 30
