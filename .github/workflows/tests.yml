name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  prod-compose-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compose config fails without required secrets
        run: |
          unset JWT_SECRET_KEY POSTGRES_PASSWORD
          if docker compose -f docker-compose.prod.yml config >/dev/null 2>&1; then
            echo "Expected compose config to fail without JWT_SECRET_KEY and POSTGRES_PASSWORD"
            exit 1
          fi

      - name: Compose config succeeds with required secrets
        env:
          JWT_SECRET_KEY: ci-prod-compose-jwt-secret-not-for-production-use
          POSTGRES_PASSWORD: ci-prod-compose-db-password
        run: docker compose -f docker-compose.prod.yml config >/dev/null

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Tempo.sln

      - name: Build
        run: dotnet build Tempo.sln --no-restore

      - name: Verify OpenAPI spec is current
        run: |
          cd api
          # Swashbuckle boots the real host. Use Development (not Testing): the generic host
          # otherwise looks for StartupTesting, which this minimal-host app does not define.
          # One-shot Postgres 16 (not a workflow services: block); host applies migrations.
          OPENAPI_PG_USER=tempo_openapi
          OPENAPI_PG_PASSWORD=tempo_openapi_ci
          OPENAPI_PG_DB=tempo_openapi
          OPENAPI_PG_CONTAINER="tempo-openapi-pg-$$"
          docker run -d --name "$OPENAPI_PG_CONTAINER" \
            -e POSTGRES_USER="$OPENAPI_PG_USER" \
            -e POSTGRES_PASSWORD="$OPENAPI_PG_PASSWORD" \
            -e POSTGRES_DB="$OPENAPI_PG_DB" \
            -p 127.0.0.1:5432:5432 \
            postgres:16-alpine
          cleanup() {
            docker rm -f "$OPENAPI_PG_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if docker exec "$OPENAPI_PG_CONTAINER" pg_isready -U "$OPENAPI_PG_USER" -d "$OPENAPI_PG_DB"; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "OpenAPI Postgres did not become ready"
              exit 1
            fi
            sleep 1
          done
          export ASPNETCORE_ENVIRONMENT=Development
          export JWT__SecretKey='ci-openapi-generation-only-not-for-production-use-32b!'
          export ConnectionStrings__DefaultConnection="Host=127.0.0.1;Port=5432;Database=${OPENAPI_PG_DB};Username=${OPENAPI_PG_USER};Password=${OPENAPI_PG_PASSWORD}"
          dotnet swagger tofile \
            --output /tmp/openapi-generated.json \
            bin/Debug/net10.0/Tempo.Api.dll \
            v1
          diff -u ../docs/openapi.json /tmp/openapi-generated.json

      - name: Run tests with coverage
        run: dotnet test Tempo.sln --no-build --verbosity detailed --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory:"TestResults" --settings:"api/Tempo.Api.Tests/coverlet.runsettings"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;Badges" \
            -classfilters:"-*Dynastream*" \
            -assemblyfilters:"-*Garmin.FIT.Sdk*"

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from Cobertura XML (line-rate attribute)
          COVERAGE_XML=$(find TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -z "$COVERAGE_XML" ]; then
            echo "❌ Coverage report not found"
            exit 1
          fi
          
          # Extract line-rate value (e.g., "0.85" for 85%)
          # Use set -o pipefail to ensure grep failure propagates, or check if result is empty
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_XML" | head -1)
          if [ -z "$COVERAGE" ]; then
            COVERAGE="0"
          fi
          
          # Calculate percentage (multiply by 100 and round)
          COVERAGE_PERCENT=$(awk "BEGIN {printf \"%.0f\", $COVERAGE * 100}")
          
          echo "Current coverage: ${COVERAGE_PERCENT}%"
          echo "Required coverage: 45%"
          
          if [ "$COVERAGE_PERCENT" -lt 45 ]; then
            echo "❌ Coverage ${COVERAGE_PERCENT}% is below the required 45% threshold"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE_PERCENT}% meets the required 45% threshold"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/coverage.cobertura.xml
            **/TestResults/**/coverage.cobertura.xml
            coverage-report/**
          retention-days: 30
